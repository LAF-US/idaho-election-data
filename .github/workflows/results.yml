name: Download election-night results
on:
  push:
    branches: [results]
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'   # every hour; download_results.py --scheduled decides what is due
permissions:
  contents: write
concurrency:
  group: download-results
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Get the repo
        env:
          TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git init -q .
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          git checkout -q -B "$GITHUB_REF_NAME" FETCH_HEAD
      - name: Download the results site's files and save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          save() {
            [ -d results.voteidaho.gov ] || { echo "Nothing downloaded."; return 0; }
            git add results.voteidaho.gov
            for f in results_monthly.txt results_official.txt results_daily.txt; do if [ -f "$f" ]; then git add "$f"; fi; done
            if git diff --cached --quiet; then echo "Nothing new from the results site."; return 0; fi
            git commit -q -m "Results site files as served"
            # If someone else pushed to the branch since this run fetched it, put this commit on top and push again.
            git push origin "HEAD:$GITHUB_REF_NAME" || {
              git fetch -q origin "$GITHUB_REF_NAME" && git rebase -q FETCH_HEAD && git push origin "HEAD:$GITHUB_REF_NAME"
            }
          }
          FAILED=0
          FLAG=""
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then FLAG=--scheduled; fi
          python3 -I download_results.py . $FLAG || FAILED=1
          save || FAILED=1
          # In the first 24 hours after poll close, keep going and pull every 5 minutes until the next
          # hourly run is due. At any other time this loop doesn't run.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            END=$(( $(date +%s) + 55 * 60 ))
            NEXT=$(( $(date +%s) + 300 ))
            while python3 -I download_results.py . --in-first-day && [ "$NEXT" -lt "$END" ] && [ "$(date +%s)" -lt "$END" ]; do
              # Each pull starts 5 minutes after the last one started, however long that one took.
              WAIT=$(( NEXT - $(date +%s) ))
              if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
              NEXT=$(( NEXT + 300 ))
              python3 -I download_results.py . --every-5-minutes || FAILED=1
              save || FAILED=1
            done
          fi
          # Files that downloaded are saved above; the run still shows as failed if any didn't, or if a save didn't push.
          if [ "$FAILED" = 1 ]; then echo "Some downloads or saves failed; the next run tries them again."; exit 1; fi
