name: Download election-night results
on:
  push:
    branches: [results]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: download-results
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the repo
        env:
          TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git init -q .
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          git checkout -q -B "$GITHUB_REF_NAME" FETCH_HEAD
      - name: Download the results site's files
        run: python3 -I download_results.py . || echo "Some downloads failed; saving the rest."
      - name: Save the files to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          [ -d results.voteidaho.gov ] || { echo "Nothing downloaded."; exit 0; }
          git add results.voteidaho.gov
          git diff --cached --quiet && { echo "Nothing new from the results site."; exit 0; }
          git commit -q -m "Results site files as served"
          git push origin "HEAD:$GITHUB_REF_NAME"
