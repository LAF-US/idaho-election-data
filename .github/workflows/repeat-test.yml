name: Repeat-download test
on:
  push:
    branches: [test-repeat]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the repo
        env:
          TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git init -q .
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          git checkout -q -B "$GITHUB_REF_NAME" FETCH_HEAD
      - name: Download again and compare
        run: python3 -I repeat_test.py
