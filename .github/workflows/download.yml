name: Download canvass site exports
on:
  push:
    branches: [download]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-canvass
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the repo
        env:
          TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git init -q .
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth=1 origin "$GITHUB_REF_NAME"
          git checkout -q -B "$GITHUB_REF_NAME" FETCH_HEAD
      - name: Download the search exports
        run: python3 -I download.py canvass.sos.idaho.gov || echo "Some downloads failed; saving the rest."
      - name: Save the files to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          [ -d canvass.sos.idaho.gov ] || { echo "Nothing downloaded."; exit 0; }
          git add canvass.sos.idaho.gov
          git diff --cached --quiet && { echo "Nothing new downloaded."; exit 0; }
          git commit -q -m "Canvass site search exports as downloaded"
          git push origin "HEAD:$GITHUB_REF_NAME"
