name: Download canvass site
on:
  push:
    branches: [download]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Download every file the canvass site links to
        run: timeout 340m python3 -I download.py canvass.sos.idaho.gov || echo "Stopped before finishing; saving what was downloaded."
      - name: Save the files to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add canvass.sos.idaho.gov
          git diff --cached --quiet && { echo "Nothing downloaded."; exit 0; }
          git commit -q -m "Canvass site files as downloaded"
          git push
